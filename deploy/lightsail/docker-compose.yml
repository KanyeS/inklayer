# Inklayer: production stack for a single small VM (AWS Lightsail $7 plan: 1 GB RAM, 40 GB SSD).
# See docs/deploy-aws-lightsail.md.
#
#   volume-init (one-shot) gives the data volume the server's non-root ownership
#   restore  (one-shot) pulls the SQLite database from S3 if the disk is empty  ─┐
#   server   Inklayer API on :8080 (internal only)                              <─┘ starts after restore
#   litestream uploads database changes to S3 (every 15 minutes by default)
#   keys-backup uploads the server's keys (/data/keys) to their own bucket when they change (KEYS_BACKUP_BUCKET)
#   keys-restore (on demand) puts them back on a new instance: docker compose run --rm keys-restore
#   caddy    public :80/:443, automatic Let's Encrypt HTTPS, proxies to server
#
# Images are pulled from a registry. Never build on the VM: it doesn't have the RAM for the .NET SDK.

name: inklayer

x-litestream: &litestream
  image: litestream/litestream:0.5.14
  # Same uid as the server, so the files Litestream creates (-shm/-wal) stay writable by the server.
  user: "1654:1654"
  env_file: .env
  environment:
    LITESTREAM_SYNC_INTERVAL: ${LITESTREAM_SYNC_INTERVAL:-15m}
  volumes:
    - inklayer-data:/data
    - ./litestream.yml:/etc/litestream.yml:ro

services:
  # One-shot: the first container to mount a fresh volume decides who owns it. This container
  # runs first, so the volume takes the server image's /data ownership (uid 1654).
  volume-init:
    image: ${INKLAYER_IMAGE:?set INKLAYER_IMAGE in .env}
    restart: "no"
    entrypoint: ["dotnet", "--list-runtimes"]
    volumes:
      - inklayer-data:/data

  restore:
    <<: *litestream
    restart: "no"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # Skips the restore if a database already exists locally, and exits cleanly if no backup exists yet (first install).
    command: ["restore", "-if-db-not-exists", "-if-replica-exists", "/data/inklayer.db"]

  server:
    image: ${INKLAYER_IMAGE:?set INKLAYER_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      restore:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Hard heap cap (256 MB) inside the 448 MB container limit below. On the 1 GB plan the box has about 330 MB free
      # with everything running at 320 MB, so this leaves the OS about 200 MB. The server idles at about 190 MB, and
      # load tests showed the container limit (not the heap) is what's hit first. See docs/load-testing.md.
      DOTNET_GCHeapHardLimit: "0x10000000"
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Inklayer__Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Inklayer__Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # People's own tracker accounts for issues: an OAuth app per tracker (see docs/integrations.md). Unset ones use shared tokens.
      Inklayer__Trackers__GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      Inklayer__Trackers__GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      Inklayer__Trackers__GitLab__ClientId: ${GITLAB_CLIENT_ID:-}
      Inklayer__Trackers__GitLab__ClientSecret: ${GITLAB_CLIENT_SECRET:-}
      Inklayer__Trackers__GitLab__Url: ${GITLAB_URL:-https://gitlab.com}
      Inklayer__Trackers__Forgejo__ClientId: ${FORGEJO_CLIENT_ID:-}
      Inklayer__Trackers__Forgejo__ClientSecret: ${FORGEJO_CLIENT_SECRET:-}
      Inklayer__Trackers__Forgejo__Url: ${FORGEJO_URL:-https://codeberg.org}
      Inklayer__Trackers__Linear__ClientId: ${LINEAR_CLIENT_ID:-}
      Inklayer__Trackers__Linear__ClientSecret: ${LINEAR_CLIENT_SECRET:-}
      Inklayer__Trackers__Jira__ClientId: ${ATLASSIAN_CLIENT_ID:-}
      Inklayer__Trackers__Jira__ClientSecret: ${ATLASSIAN_CLIENT_SECRET:-}
      Inklayer__Trackers__AzureDevOps__ClientId: ${AZURE_DEVOPS_CLIENT_ID:-}
      Inklayer__Trackers__AzureDevOps__ClientSecret: ${AZURE_DEVOPS_CLIENT_SECRET:-}
      Inklayer__Trackers__AzureDevOps__TenantId: ${AZURE_DEVOPS_TENANT_ID:-organizations}
      Inklayer__Trackers__AzureDevOps__CertificatePath: ${AZURE_DEVOPS_CERTIFICATE_PATH:-}
      Inklayer__Trackers__AzureDevOps__CertificatePassword: ${AZURE_DEVOPS_CERTIFICATE_PASSWORD:-}
      # Full-page screenshots and videos: an S3 bucket (it can be the backups' bucket; they're kept under media/), or
      # without one, /data/media on the server. The server passes them on, so people download from the server, not S3.
      # The network a comment came from (its owner and country, never the address), from DB-IP's free databases.
      Inklayer__IpData__Enabled: ${INKLAYER_IP_DATA:-true}
      Inklayer__Media__S3Bucket: ${MEDIA_S3_BUCKET:-}
      Inklayer__Media__S3Region: ${MEDIA_S3_REGION:-${AWS_REGION:-}}
      AWS_ACCESS_KEY_ID: ${MEDIA_AWS_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-}}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_AWS_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      Inklayer__Auth__Oidc__0__Id: ${OIDC_ID:-}
      Inklayer__Auth__Oidc__0__DisplayName: ${OIDC_DISPLAY_NAME:-}
      Inklayer__Auth__Oidc__0__Authority: ${OIDC_AUTHORITY:-}
      Inklayer__Auth__Oidc__0__ClientId: ${OIDC_CLIENT_ID:-}
      Inklayer__Auth__Oidc__0__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Inklayer__Auth__Oidc__0__Scopes: ${OIDC_SCOPES:-openid email profile}
      Inklayer__Auth__Oidc__0__VerifiedDomains: ${OIDC_VERIFIED_DOMAINS:-}
      Inklayer__Auth__BootstrapAdmins: ${INKLAYER_BOOTSTRAP_ADMINS:?set INKLAYER_BOOTSTRAP_ADMINS in .env}
      Inklayer__Auth__ExtensionRedirectUris: ${INKLAYER_EXTENSION_REDIRECT_URIS:-}
      # Optional: only answer requests from these networks (e.g. the VPN). Admins can change it later on the Admin page.
      Inklayer__Network__AllowedNetworks: ${INKLAYER_ALLOWED_NETWORKS:-}
      Inklayer__Network__RestrictionDisabled: ${INKLAYER_NETWORK_RESTRICTION_DISABLED:-false}
      Inklayer__Features__Docs: ${INKLAYER_FEATURE_DOCS:-true}
      Inklayer__Features__LiveCursors: ${INKLAYER_FEATURE_LIVE_CURSORS:-true}
      Inklayer__Features__Mcp: ${INKLAYER_FEATURE_MCP:-true}
      Inklayer__Features__BugContext: ${INKLAYER_FEATURE_BUG_CONTEXT:-true}
      Inklayer__Features__IssueTrackers: ${INKLAYER_FEATURE_ISSUE_TRACKERS:-true}
      Inklayer__Features__Sharing: ${INKLAYER_FEATURE_SHARING:-true}
      Inklayer__Features__Boards: ${INKLAYER_FEATURE_BOARDS:-true}
      # Links in emails and Slack posts from background work (requests use their own address).
      Inklayer__PublicUrl: https://${INKLAYER_DOMAIN}
      # Notification emails (optional; e.g. Amazon SES's SMTP interface).
      Inklayer__Smtp__Host: ${INKLAYER_SMTP_HOST:-}
      Inklayer__Smtp__Port: ${INKLAYER_SMTP_PORT:-587}
      Inklayer__Smtp__Username: ${INKLAYER_SMTP_USERNAME:-}
      Inklayer__Smtp__Password: ${INKLAYER_SMTP_PASSWORD:-}
      Inklayer__Smtp__From: ${INKLAYER_SMTP_FROM:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - inklayer-data:/data
      # Certificates the server signs in with (AZURE_DEVOPS_CERTIFICATE_PATH=/certs/...). Readable by uid 1654.
      - ./certs:/certs:ro
    expose:
      - "8080"
    mem_limit: 448m
    # No swap for the server itself (the box still swaps everything else): past its limit it's killed and restarts in
    # about 10 seconds, instead of stalling for minutes while it swaps. Docker's default lets it swap another 448 MB.
    memswap_limit: 448m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  litestream:
    <<: *litestream
    restart: unless-stopped
    command: ["replicate"]
    depends_on:
      server:
        condition: service_started
    mem_limit: 64m
    logging: *logging

  # The keys that encrypt saved secrets (sign-in providers added on the Admin page, integrations) and sign tokens aren't in
  # the database backup, so a stolen backup doesn't give them away. This keeps a copy in a bucket of their own, which the
  # server's AWS key can write to but not read. See docs/deploy-aws-lightsail.md, "Keys".
  keys-backup:
    image: &aws-cli amazon/aws-cli:2.42.1
    restart: on-failure
    user: "1654:1654"
    entrypoint: ["bash", "/keys-backup.sh"]
    command: ["backup"]
    environment: &keys-env
      HOME: /tmp
      AWS_REGION: ${AWS_REGION:-}
      KEYS_BACKUP_BUCKET: ${KEYS_BACKUP_BUCKET:-}
    volumes:
      - inklayer-data:/data:ro
      - ./keys-backup.sh:/keys-backup.sh:ro
    depends_on:
      server:
        condition: service_started
    mem_limit: 128m
    logging: *logging

  # On demand, with credentials that can read the keys bucket (yours, not the server's):
  #   docker compose stop server
  #   docker compose run --rm -e AWS_ACCESS_KEY_ID=... -e AWS_SECRET_ACCESS_KEY=... keys-restore
  #   docker compose up -d
  keys-restore:
    image: *aws-cli
    profiles: ["restore"]
    restart: "no"
    user: "1654:1654"
    entrypoint: ["bash", "/keys-backup.sh"]
    command: ["restore"]
    environment: *keys-env
    volumes:
      - inklayer-data:/data
      - ./keys-backup.sh:/keys-backup.sh:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      INKLAYER_DOMAIN: ${INKLAYER_DOMAIN:?set INKLAYER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 64m
    logging: *logging

volumes:
  inklayer-data:
  caddy-data:
  caddy-config:
