# Litestream 0.5 (Apache-2.0): continuous SQLite replication to S3.
# Credentials depend on LITESTREAM_AUTH in .env: an access key (keys), or the Lightsail
# instance's own credentials (instance). See litestream-auth.*.yml.
# ${VAR} references are expanded from the environment.

# Full snapshot daily; changes in between are uploaded every LITESTREAM_SYNC_INTERVAL (.env, 15m by default), so
# a lost disk loses at most that much (people still see each other's changes at once: the server reads its own disk).
# Keep 7 days of point-in-time history.
snapshot:
  interval: 24h
  retention: 168h

# S3 bills every upload and listing. Litestream's defaults (upload every second, merge every 30 s / 5 min /
# 1 h, check for old files every 15 s) cost about $5 a month in requests on a quiet server; these slower
# timings keep it to cents. Merge the uploads hourly, then into the daily snapshot.
levels:
  - interval: 1h
l0-retention-check-interval: 15m

dbs:
  - path: /data/inklayer.db
    replica:
      url: s3://${LITESTREAM_BUCKET}/inklayer.db
      region: ${AWS_REGION}
      sync-interval: ${LITESTREAM_SYNC_INTERVAL}
