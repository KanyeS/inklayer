# Inklayer: self-hosted stack.
#   cp .env.example .env    (optional, then edit the values)
#   docker compose up -d
# Put a TLS reverse proxy in front of it (see Caddyfile.example).
#
# Storage is a SQLite database plus snapshot files, both on the `inklayer-data` volume.
# Run ONE server replica: SQLite allows a single writer, and the volume must be local disk (not NFS/SMB).

name: inklayer

services:
  server:
    image: ${INKLAYER_IMAGE:-inklayer-server:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Inklayer__Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Inklayer__Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Inklayer__Auth__BootstrapAdmins: ${INKLAYER_BOOTSTRAP_ADMINS:-}
      Inklayer__Auth__ExtensionRedirectUris: ${INKLAYER_EXTENSION_REDIRECT_URIS:-}
      # Plain-HTTP local trial only. Remove when serving through HTTPS.
      Inklayer__Auth__AllowInsecureHttp: ${INKLAYER_ALLOW_INSECURE_HTTP:-false}
    ports:
      - "${INKLAYER_PORT:-8080}:8080"
    volumes:
      - inklayer-data:/data

volumes:
  inklayer-data:
