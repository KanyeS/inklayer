<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Inklayer</title>
  <!-- Inklayer: a comment bubble with a drop of ink, over a second sheet (the layer on the page). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="36" y="20" width="68" height="56" rx="15" fill="#fff" fill-opacity="0.3" transform="rotate(10 70 48)"/>
  <path d="M40 36h50a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H58l-18 16v-16a16 16 0 0 1-16-16V52a16 16 0 0 1 16-16z" fill="#fff"/>
