# Dependabot: security fixes are opened as soon as an advisory is published; routine updates come weekly, grouped so
# minor and patch bumps arrive as one PR per ecosystem. CI (lint, tests, licence and vulnerability checks) runs on each PR.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    groups:
      nuget-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in deploy/Dockerfile (.NET SDK, ASP.NET runtime, Node).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
