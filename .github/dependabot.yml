# Dependabot: security fixes are opened as soon as an advisory is published; routine updates come weekly, one PR per
# package, and only for versions at least 7 days old (cooldown: most hijacked releases are pulled before then). PRs are
# not grouped because a group can carry members still inside the cooldown along with one that has passed it. Each PR
# merges itself once the dev ruleset's required checks pass (.github/workflows/dependabot-automerge.yml).
# PRs target dev (main is only fast-forwarded from dev on release). The server stays on the .NET LTS line: .NET platform
# majors (SDK, runtime, ASP.NET/EF packages, the SignalR JS client that pairs with them) are moved together by hand.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      - dependency-name: "dotnet-ef"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@microsoft/signalr"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base images in deploy/Dockerfile (.NET SDK, ASP.NET runtime, Node). Node majors: take only even (LTS) ones, and
  # keep client/.nvmrc in step.
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "dotnet/*"
        update-types: [version-update:semver-major]
