# Dependabot: security fixes are opened as soon as an advisory is published; routine updates come weekly, grouped so
# minor and patch bumps arrive as one PR per ecosystem. CI (lint, tests, licence and vulnerability checks) runs on each PR.
# PRs target dev (main is only fast-forwarded from dev on release). The server stays on the .NET LTS line: .NET platform
# majors (SDK, runtime, ASP.NET/EF packages, the SignalR JS client that pairs with them) are moved together by hand.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      - dependency-name: "dotnet-ef"
        update-types: [version-update:semver-major]
    groups:
      nuget-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@microsoft/signalr"
        update-types: [version-update:semver-major]
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in deploy/Dockerfile (.NET SDK, ASP.NET runtime, Node). Node majors: take only even (LTS) ones, and
  # keep client/.nvmrc in step.
  - package-ecosystem: docker
    directory: /deploy
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/*"
        update-types: [version-update:semver-major]
