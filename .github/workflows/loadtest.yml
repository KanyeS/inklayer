name: Load test

# Every push to main: builds the server image, runs it on this runner with the production box's limits
# (2 CPUs, 448 MB, 256 MB heap, behind production's Caddyfile) and puts a fixed, modest load on it for 2 minutes.
# Fails when reads, writes, doc editing, media or live connections get slower or start failing: a regression check, not a capacity figure.
# For the real limits of the Lightsail box, run "Load test (Lightsail)". See docs/load-testing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loadtest:
    name: Load test (CI profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INKLAYER_IMAGE: inklayer-server:loadtest
      COMPOSE_FILE: loadtest/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: inklayer-server:loadtest
          build-args: VERSION=0.0.0-loadtest.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the server
        run: |
          mkdir -p loadtest/results
          docker compose up -d caddy fake-gitlab-tls
          nohup loadtest/stats.sh inklayer-loadtest-server-1 2 > loadtest/results/stats.csv 2>/dev/null &

      - name: Run k6
        id: k6
        run: |
          LOADTEST_UID="$(id -u)"
          export LOADTEST_UID
          docker compose run --rm k6 2>&1 | tee loadtest/results/k6.log

      - name: Summary
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          {
            echo "## Load test (CI profile)"
            echo
            echo "2 minutes of 40 reads/s, 5 comment writes/s, 40 live connections, 5 people typing in docs, 4 people playing recordings, 6 recorded comments uploaded a minute and 4 issues with attachments a minute. On 2 CPUs and 448 MB like the Lightsail box."
            echo
            echo '```'
            sed -n '/THRESHOLDS/,/TOTAL RESULTS/p' loadtest/results/k6.log | grep -v 'TOTAL RESULTS'
            echo '```'
            echo
            echo "### Every 30 seconds"
            echo
            python3 loadtest/report.py loadtest/results/metrics.csv.gz --step-seconds 30 --steps 4 \
              --stats loadtest/results/stats.csv --read-p95 300 --write-p95 600 | sed '/^\*\*Capacity/,$d'
            restarts="$(docker inspect -f '{{.RestartCount}} restarts, out of memory: {{.State.OOMKilled}}' inklayer-loadtest-server-1)"
            echo
            echo "Server container: ${restarts}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server log
        if: always()
        run: docker compose logs --no-color server caddy fake-gitlab > loadtest/results/server.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-results
          path: loadtest/results
          retention-days: 14

      - name: Stop
        if: always()
        run: docker compose down -v
