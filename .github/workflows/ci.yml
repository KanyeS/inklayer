name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  server:
    name: Server — build, test, licences
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: server/global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Known vulnerabilities (NuGet, including transitive)
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::A NuGet package has a known vulnerability. Update it (see above)."
            exit 1
          fi

      - name: Dependency licence check (permissive only)
        run: >
          dotnet nuget-license -i Inklayer.slnx -t
          -a ../.github/licenses/allowed-licenses.json
          -override ../.github/licenses/nuget-overrides.json

  client:
    name: Client — lint, typecheck, test, build, licences
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Shipped dependencies only: dev tools (Vite, Vitest, Biome) never reach users.
      - name: Known vulnerabilities (npm, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - name: Dependency licence check (permissive only)
        run: npm run licenses
      - uses: actions/upload-artifact@v7
        with:
          name: inklayer-extension
          path: client/apps/extension/dist

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: inklayer-server:ci
          build-args: VERSION=0.0.0-ci.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
