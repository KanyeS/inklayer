name: ZAP security scan

# Builds the server image from this commit, runs a throwaway copy inside the job (empty database, no sign-in providers),
# and scans it with ZAP. It never touches the live server, so it works whether or not that's up, and the active API scan
# can't leave junk in real data.
#   Baseline: spiders the app and checks responses (headers, cookies, leaks). Passive only.
#   API scan: attacks every endpoint in the server's own OpenAPI document. Without a signed-in user most answer 401,
#             which checks that they're protected; signed-in coverage needs a test token (ZAP_AUTH_HEADER_VALUE).
# Findings are kept in one GitHub issue per scan (updated each run) and in the run's artifacts. To silence a false
# positive, add a rules file (rule id<TAB>IGNORE<TAB>note) and pass it as rules_file_name.
on:
  schedule:
    - cron: "23 3 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: zap
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: inklayer-server:zap
          build-args: VERSION=0.0.0-zap.${{ github.run_number }}
          cache-from: type=gha

      # Plain HTTP on localhost, so the HTTPS requirement is relaxed for this copy only.
      - name: Start a throwaway server
        run: |
          docker run -d --name inklayer -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e Inklayer__Auth__AllowInsecureHttp=true \
            inklayer-server:zap
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null; then echo "Server is ready."; exit 0; fi
            sleep 2
          done
          docker logs inklayer
          echo "::error::The server didn't become ready."
          exit 1

      - name: Baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          artifact_name: zap-baseline
          issue_title: "ZAP baseline scan"

      - name: API scan
        if: ${{ !cancelled() }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8080/openapi/v1.json
          format: openapi
          artifact_name: zap-api
          issue_title: "ZAP API scan"

      - name: Server log
        if: ${{ !cancelled() }}
        run: docker logs inklayer > server.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: zap-server-log
          path: server.log
