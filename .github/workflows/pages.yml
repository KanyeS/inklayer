name: Website

# Builds the showcase (client/apps/site, which uses the extension's own overlay code) and publishes it to GitHub Pages
# at https://inklayer.online. One-time setup: Settings → Pages → Source: "GitHub Actions", custom domain inklayer.online.
on:
  push:
    branches: [main]
    paths:
      - "client/apps/site/**"
      - "client/packages/overlay/**"
      - "client/packages/ui/src/styles/**"
      - "client/apps/extension/src/lib/pageDetails.ts"
      - "client/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
